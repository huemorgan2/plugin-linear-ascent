floor: 35
tier: 4
biome: Webdeep
zone: The Signal Deeps
gate_town: Faintlight
banner: webdeep
arrival: >-
  The caverns here are stacked with the tower's thinking-engines, racks
  of them running down into the dark, warm to the touch and muttering.
  The spiders web the aisles for the heat. Whatever the engines are
  computing, they have been at it since the theft.
encounters:
  - id: rack_spider
    name: Rack-weaver
    lore: >-
      It webbed a whole engine-rack into its nest and grew strange on the
      warmth. Its eyes reflect your lamp in rows, like little status
      lights.
    weight: 3
    traits: [resist_low, lean, feeble]
    prose: >-
      A spider has webbed an entire engine-rack into its nest and grown
      strange on the warmth. Its eyes reflect your lamp in rows, like
      little status lights.
  - id: signal_husk
    name: Signal husk
    lore: >-
      The engines have been using it. It walks with a purpose nothing dead
      should have, and spells blur against whatever is being computed
      inside.
    weight: 3
    traits: [resist_med, feeble]
    prose: >-
      A husk hangs wired into the racks, and the engines have been
      using it — it walks toward you with a purpose nothing dead should
      have, trailing neat bundles of cable.
  - id: heat_troll
    name: Heat-drunk troll
    lore: >-
      It sleeps pressed to the warmest rack like a cat against a stove.
      Your footstep landed wrong.
    weight: 2
    traits: [slow, lean, savage]
    prose: >-
      A deep troll sleeps pressed against the warmest rack like a cat
      against a stove. Your footstep lands wrong. It is not asleep
      anymore.
  - id: aisle_runner
    name: Aisle-runner
    lore: >-
      Bred lean by generations of hunting the warm aisles. The racks light
      up as it passes, row by row.
    weight: 2
    traits: [fast, hulking, fierce]
    prose: >-
      Down the long aisle every rack flickers in sequence, faster and
      faster — and then the spider making them flicker is already at your
      knee, all legs and momentum.
warden:
  name: Warden Echobone
  prose: >-
    Echobone keeps the deepest aisle, a thing of rack-iron and troll
    bone that speaks in playback — your own voice, your own footsteps,
    everything the engines have heard you do since the threshold.
