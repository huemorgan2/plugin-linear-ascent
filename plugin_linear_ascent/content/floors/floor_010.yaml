floor: 10
tier: 1
biome: Greenreach
zone: The Kingsfield
gate_town: Bannerline
banner: gnarl
arrival: >-
  The last meadow before the lift is a parade ground now. Goblin banners
  in their hundreds, rifle crates stacked into walls, and every path
  raked clean for the King's inspection. They know you're coming.
encounters:
  - id: kings_guard
    name: Goblin king's guard
    lore: >-
      Gnarl armors his own in tower-scrap, plate over plate. Under it
      beats a heart loyal past sense.
    weight: 3
    traits: [armor_med]
    prose: >-
      Two crossed scrap-rifles bar the path — a king's guard in salvaged
      breastplate, better fed than any goblin below, and prouder. Old
      arrows lie snapped in the gravel where its plate turned them.
  - id: banner_wolf
    name: Banner-broken wolf
    lore: >-
      It carried the king's standard until the standard burned. It
      fights like it still owes the debt.
    weight: 2
    traits: [frail, feeble]
    prose: >-
      A wolf on a chain guards the crate-wall, banner-cloth knotted at
      its collar. It has stopped fighting the chain. It waits for you.
  - id: drill_sergeant
    name: Goblin drill sergeant
    lore: >-
      It taught a thousand goblins where to put a spear. It has no
      plans to be out-taught by you.
    weight: 3
    traits: [sturdy, fierce]
    prose: >-
      A goblin sergeant halts its squad's drill, hands you one long
      look, and sends the recruits to lunch. This one it keeps.
  - id: kings_courier
    name: King's courier
    lore: >-
      It runs the king's word between camps and has never once been
      caught. It would rather die than be late.
    weight: 2
    traits: [fast, lean, savage]
    prose: >-
      A goblin courier in cut-down harness sprints the raked paths
      with the King's dispatches — and swerves at you, because a
      climber's head is worth more than any letter it carries.
warden:
  name: Gnarl, the Goblin King
  prose: >-
    On a throne of stacked rifle crates slouches Gnarl, crowned in salvage
    and fat with tribute. He raises one hand, and the parade ground goes
    quiet enough to hear the lift humming behind the throne.
npc:
  name: Vail
  role: watch sergeant
  greet: >-
    A climber in patched colors watches the parade ground through a
    slit in the palisade. "Sergeant Vail — what's left of the last
    push. We counted the banners. Then we counted our dead. Sit down
    before they see you."
  lore: >-
    "Every path out there is raked for inspection and walked by guards
    in tower-scrap plate. The couriers run the gaps — fast, and they
    scream when they see you. Take them quiet or the whole field knows
    your name."
  warn: >-
    "The King holds the lift and no blade takes him alone. This is
    war-party work — pledge at the Guildhall and come back with
    numbers. The banners come down together or not at all."
