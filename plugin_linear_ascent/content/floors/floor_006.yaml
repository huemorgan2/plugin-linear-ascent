floor: 6
tier: 1
biome: Deep
zone: The Threshold Dark
gate_town: Lastlight
banner: floor_006
arrival: >-
  The floodlights fail at the last terrace and the true dark begins — a
  cavern country floored a thousand years deep in guano, silk in the
  high corners, cold that has never known a season. Bring your own
  light or bring nothing.
encounters:
  - id: grave_moth
    name: Grave-rat
    kind: native
    was: >-
      a pallid rat-pup of the guano beds
    lore: >-
      Drawn to warm breath even then. Palm-broad now, it powders the
      eyes with grave-dust.
    weight: 3
    traits: [flying, frail, feeble]
    prose: >-
      Something soft drops onto your shoulder in the dark, then clings
      — a palm-broad rat drawn to your breathing, kicking blinding
      grave-dust into your eyes.
  - id: guano_vole
    name: Guano vole
    kind: native
    was: >-
      a blind vole of the roost-floor
    lore: >-
      Bloated and bold, it gnaws boots, rope, and whatever the rope
      holds.
    weight: 2
    traits: [frail, feeble]
    prose: >-
      The soft floor humps and splits at your boot — a blind vole,
      bloated and bold, already gnawing at your laces as if you were
      rope.
  - id: silk_broodling
    name: Cave broodling
    kind: native
    was: >-
      a spiderling of the corner-silk
    lore: >-
      Dog-sized and hunting in threads — the first of many broods
      above.
    weight: 2
    traits: [lean, fast, fierce]
    prose: >-
      A thread brushes your face in the dark. Then the thread pulls — a
      dog-sized broodling riding its own line down, forelegs first.
  - id: vault_weaver
    name: Sentinel spider
    kind: native
    was: >-
      the vault's big ambush-weaver
    lore: >-
      Fever-quick now, it drops on a shielded lamp from the unseen
      roof.
    weight: 2
    traits: [sturdy, savage]
    prose: >-
      Your lamp's glow finds eight points of light in the roof,
      arranged in a pattern, descending. The vault's old ambush-weaver
      has your lamp — and you — marked.
  - id: lane_boar
    name: Vault boar
    kind: native
    was: >-
      a drover's boar that followed the delver road down and never
      came back up
    lore: >-
      Blind and guano-crusted, it plugs the narrow ways and gives you
      only its front. The one road on is through.
    weight: 2
    traits: [bulwark, slow]
    prose: >-
      The crawl ahead is stopped by a wall of crusted bristle — a blind
      boar grown into the passage it guards, front-on, going nowhere.
      Neither are you, until it does.
  - id: wrapped_husk
    name: Silk-wrapped husk
    kind: wrongmade
    lore: >-
      A delver lost to the silk, aether pooled in the bundle. It mimics
      a caught man's voice.
    weight: 1
    traits: [resist_low, sturdy, slow]
    prose: >-
      From the dark comes a man's voice calling for help, word-perfect.
      The shape that walks out wearing it is a cocoon of silk, and it
      is empty.
warden:
  name: Warden Duskspin
  prose: >-
    The stair-lift arch is webbed shut with steel silk, and the roof
    above it is alive. Duskspin drops without a sound — a sentinel
    spider welded huge, spinnerets laying cable for thread, cutting
    lamps first.
npc:
  name: Sable Lastlamp
  role: echo-reader
  greet: >-
    A woman stands at the last lit stone, eyes shut, listening. "Sable
    Lastlamp. This is where the light ends — everything past here, you
    carry yourself. Clap once, and I'll tell you the shape of the
    room."
  lore: >-
    "The vault reads by echo — a true echo means open stone, a dead one
    means silk. The silk grows faster than any spider could spin it.
    If the dark answers in a man's voice, it is not a man."
  warn: >-
    "Duskspin holds the deep wall, and it owns the dark you'd cross to
    reach it. It cuts lamps first, climbers second. Shield your flame
    and watch the roof — it never comes by the floor."
