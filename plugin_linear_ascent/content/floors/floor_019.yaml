floor: 19
tier: 2
biome: Ironvale
zone: The Broken Doors
gate_town: Last Lantern
banner: ironvale
arrival: >-
  This is where the dwarves made their stand: vault doors a yard thick,
  blown off their hinges and lying where they fell. The scorch-marks
  climb three stories. Nobody has moved the doors. Nobody could.
encounters:
  - id: door_breaker
    name: Red Orc door-breaker
    lore: >-
      It was in the breach when the doors came down, and the warframe
      still carries the dwarf-fire scars. It is owed, it feels.
    weight: 3
    traits: [feeble, armoured]
    prose: >-
      A veteran of the breach, warframe scarred by dwarf-fire, patrols
      the fallen doors it helped fell. It remembers this floor costing
      blood, and means to be repaid.
  - id: powder_kobold
    name: Kobold powder-boy
    lore: >-
      A keg under each arm and a fuse for a scarf. It has outlived every
      crew it ever served, which should worry the crews.
    weight: 3
    traits: [frail, feeble]
    prose: >-
      A kobold in a scorched apron trots past with a keg under each
      arm, fuse-cord looped around its neck like a scarf. It grins and
      sets one keg down between you.
  - id: doorward_remnant
    name: Doorward remnant
    lore: >-
      One door-engine survived the breach and never accepted it. It cannot
      be argued past — only outlasted.
    weight: 2
    traits: [bulwark, fierce]
    prose: >-
      One dwarven door-engine survived the breach, and it has not
      accepted the news. It holds a doorway with no door, halberd-arms
      crossed, and will not be reasoned past.
  - id: breach_crow
    name: Breach crow
    lore: >-
      It followed the Red Orcs up-tower the way crows have always followed
      armies. The breach was the best day of its life.
    weight: 2
    traits: [sturdy, fierce, fly]
    prose: >-
      A crow the size of a dog drops off a fallen door-slab and beats up
      into the scorched dark, circling — it has watched enough battles
      here to know to wait for the middle.
  - id: scorch_rat
    name: Scorch rat
    lore: >-
      The breach cooked everything in the hall but the rats, and the rats
      took notes.
    weight: 2
    traits: [sturdy, savage]
    prose: >-
      A rat with burn-bald patches works the seam of a fallen door, prying
      at old rations. It looks up with the flat calm of a survivor and
      comes over to try you instead.
warden:
  name: Warden Gatebone
  prose: >-
    Gatebone was built from the breach's wreckage — hinge-plates for
    shoulders, a slab of blown door for a shield. It fights like the
    last argument of a people who built things to hold.
