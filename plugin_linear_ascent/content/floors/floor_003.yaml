floor: 3
tier: 1
biome: Men
zone: The Drowned Pasture
gate_town: Weirsend
banner: floor_003
arrival: >-
  A pasture taken mid-flood and never drained — grey water to the
  horizon, hedge-tops and half-drowned fences breaking the surface.
  Hay-ricks stand as islands. Somewhere a sluice still turns, keeping
  the wrong things wet.
encounters:
  - id: sluice_wolf
    name: Marsh wolf
    kind: native
    was: >-
      A fen-edge wolf that hunted the drier islands.
    lore: >-
      Web-footed now, wading the channels between the ricks. It swims
      better than you pole.
    weight: 3
    traits: [lean, fast]
    prose: >-
      A wolf breasts the grey water between two hay-ricks, web-footed
      and low, only its eyes and shoulders showing. It has learned that
      punts tip.
  - id: reed_adder
    name: Marsh adder
    kind: native
    was: >-
      A shy grass-snake of the banks.
    lore: >-
      Fever-bold now, striking from the reed at anything warm.
    weight: 3
    traits: [frail, feeble]
    prose: >-
      The sedge parts without wind. A marsh adder rides the shallow
      water in slow curves, tongue reading your warmth, no longer shy
      of anything.
  - id: mire_boar
    name: Mire boar
    kind: native
    was: >-
      A pasture boar that fed along the drowned hay.
    lore: >-
      Mud-armored to the eyes, it beds in the reed and bursts out at a
      punt's shadow.
    weight: 2
    traits: [sturdy, savage]
    prose: >-
      The reed-bank explodes and a boar comes through it mud-armored to
      the eyes, throwing a bow-wave. It heard your pole touch bottom.
  - id: wire_eel
    name: Fence-wire eel
    kind: native
    was: >-
      A fen eel that hunted along the flooded fence-lines.
    lore: >-
      Grown long around the drowned fence-wire until wire and eel are
      one barbed length.
    weight: 2
    traits: [armor_low, lean]
    prose: >-
      What looks like drowned fence-wire moves — an eel grown through
      the barbs until steel and muscle are one length, sawing the water
      toward your legs.
  - id: windfall_haunt
    name: Drowned lantern
    kind: wrongmade
    lore: >-
      A trapper's lamp lost in the flood, aether soaked into the dead
      flame. It calls punts onto the black reed.
    weight: 2
    traits: [resist_low, sturdy]
    prose: >-
      A cold light drifts over the water, patient as a ferryman, and
      swings your way. There is no hand carrying it. There never was.
warden:
  name: Warden Sedgeback
  prose: >-
    The mill-pool heaves and Sedgeback wades out of it — a mire boar
    under a weir-iron carapace of green bronze, shedding water like a
    roof. It charges the shallows in a bow-wave that hides its feet.
npc:
  name: Old Nan Sedge
  role: weir-keeper
  greet: >-
    An old woman sits the weir-sill with her boots in the spill. "Nan
    Sedge, weir-keeper — for what that's worth. The weir works. That's
    the joke of it: the weir works, and everything it kept dry is
    under. Tie your punt and talk."
  lore: >-
    "The old drove-road runs just under the surface, rim to rim — the
    one dry-footed line across, if you can read where it bends. The
    black reed opens a hand to the bone. Stay off it."
  warn: >-
    "Sedgeback wallows the drowned mill-pool, the deepest water on the
    floor. You'll see the bow-wave before you ever see the boar. Fight
    it in the shallows or don't fight it at all."
