floor: 3
tier: 1
biome: Greenreach
zone: The Orchard Rows
gate_town: Cider Cross
banner: greenreach
arrival: >-
  An orchard in perfect rows, gone wild at the crowns. Windfall apples rot
  sweet in the grass. Between the trunks, wire has been strung at ankle
  height — someone hunts here, and not with teeth.
encounters:
  - id: orchard_wolfpack
    name: Orchard wolf
    lore: >-
      The pack splits around the apple rows and folds back in behind
      you. One wolf is never one wolf.
    weight: 3
    traits: [lean, fast]
    prose: >-
      A wolf steps out between the rows ahead — and you hear a second one
      behind you stop moving. The pack has done this before.
  - id: snare_goblin
    name: Snare-line goblin
    lore: >-
      It seeds the grass with wire and waits. The limp in its walk is
      an old lesson from its own line.
    weight: 3
    traits: [frail, feeble]
    prose: >-
      A goblin drops from a bough, trailing the snare-wire it was laying.
      It levels a scrap-pistol with both hands and shrieks for its due.
  - id: rabid_boar
    name: Cider-mad boar
    lore: >-
      It ate the fermented windfalls by the barrel. There is no plan
      in it now, only speed and spit.
    weight: 2
    traits: [hulking, savage]
    prose: >-
      A boar reels out of the windfalls, drunk on rot and mean with it,
      foam at the tusks and no interest in going around you.
  - id: windfall_haunt
    name: Windfall haunt
    lore: >-
      Rot-light over the orchard floor. Blades stir it like smoke;
      it drinks a little of every cast.
    weight: 2
    traits: [resist_low, sturdy]
    prose: >-
      The sweet rot between two rows thickens into a shape — a haunt
      fed on spoiled harvest, wearing the orchard's shimmer like a
      coat. Spellwork slides off it the way light slides off cider.
warden:
  name: Warden Applewrath
  prose: >-
    In the press-house, the Warden waits among the vats: a great ape-frame
    of orchard timber and engine parts, cider steaming from its joints.
npc:
  name: Old Perry
  role: orchard keeper
  greet: >-
    A stooped figure racks cider under a tarp. "Perry. This was my
    family's orchard nine generations. Have a cup — then mind the wire
    between the trunks. It isn't mine."
  lore: >-
    "The goblins strung snare-line at ankle height through the good
    rows, and the wolves learned to drive prey onto it. Walk the mown
    strips, and watch the windfalls — some of them hum."
  warn: >-
    "Applewrath nests in the press-house by the lift. It has taken the
    harvest for its own, and it prunes trespassers same as branches."
