floor: 49
tier: 5
biome: The Scorch
zone: The Wyrmroad
gate_town: Moltgate
banner: scorch
arrival: >-
  The last stretch before the Cindermouth is a highway melted by use —
  a channel of glassed ash, polished by the belly of something that
  commutes.   Shed scales the size of doors lean against the banks,
  still warm. The locals harvest them on the quiet days.
encounters:
  - id: road_wyrmling
    name: Road wyrmling
    lore: >-
      It practices its glide down the melted channel. It bowls into you
      more than it attacks you, but it weighs what a boat weighs, and it
      is teething.
    weight: 3
    traits: [lean, feeble, fly]
    prose: >-
      A wyrmling practices its glide down the melted channel, wings
      hissing on the glass. It bowls into you more than it attacks
      you, but it weighs what a boat weighs, and it is teething.
  - id: scale_picker
    name: Scale-picker ogre
    lore: >-
      The scale trade made it rich by ogre standards, and it wears its
      stock — shed wyrm-plate lapped like roof tiles. Rich things hire
      fewer witnesses.
    weight: 3
    traits: [feeble, armoured]
    prose: >-
      An ogre pries a shed scale off the bank with a whole tree for a
      lever. The scale trade has made it rich by ogre standards, and
      rich things hire fewer witnesses.
  - id: molt_salamander
    name: Molt-fat salamander
    lore: >-
      Glutted on shed skin: gleaming, slow — right up until it is none of
      those things.
    weight: 2
    traits: [lean, savage, magic_resist]
    prose: >-
      The salamanders follow the Wyrmroad eating shed skin, and this
      one is glutted, gleaming, slow — right up until it is none of
      those things.
  - id: glass_hare
    name: Glass hare
    lore: >-
      It runs the polished channel for the speed of it, and it has learned
      to use climbers as corner-posts.
    weight: 2
    traits: [hulking, fierce]
    prose: >-
      Something small takes the melted channel at a speed that should not
      corner — a hare with glass-worn claws, banking off the banks, using
      you as the next turn.
warden:
  name: Warden Moltcrown
  prose: >-
    Moltcrown was made from the wyrm's castoffs — a rearing shape
    armored in shed scales, crested with old fang. It holds the last
    gate before the nest, and it fights like something auditioning
    for its maker.
