floor: 41
tier: 5
biome: The Scorch
zone: The Ashline
gate_town: Greywell
banner: scorch
arrival: >-
  You come up out of the dark into heat like a hand on your face. Ash
  desert runs flat to a shimmering horizon, grey over the buried slag
  of some reactor the tower broke in the taking. The locals paint
  their roofs white, and their deep wells still come up warm.
encounters:
  - id: ash_salamander
    name: Ash salamander
    lore: >-
      It swims the ash the way fish swim water, and heat rolls off it in
      welcome. Fire is where it lives; spells of it are a compliment.
    weight: 3
    traits: [resist_low, lean, feeble]
    prose: >-
      A salamander surfaces through the ash like a swimmer, black-
      scaled, trailing heat-shimmer. Where it rests its chin, the
      ground glazes over.
  - id: dune_ogre
    name: Dune ogre
    lore: >-
      Skin baked to crockery, patience baked harder. Your water skin
      became community property on sight.
    weight: 3
    traits: [slow, lean, fierce]
    prose: >-
      An ogre plods the ashline with a wagon axle for a walking stick,
      skin baked to crockery. It is crossing to somewhere cooler and
      has decided your water skin is community property.
  - id: ash_vulture
    name: Cinder vulture
    lore: >-
      It roosts on the warm vents and has gone strange with it. A polite
      landing distance, out here, is a diagnosis.
    weight: 2
    traits: [flying, lean, savage]
    prose: >-
      Vultures out here roost on the warm vents and have gone strange
      with it, feathers singed to wire. One lands ahead of you at a
      polite distance, which out here is a diagnosis.
  - id: ashline_jackal
    name: Ashline jackal
    lore: >-
      It works the line between the wells and the waste, living off what
      turns back too late.
    weight: 2
    traits: [hulking, fierce]
    prose: >-
      A jackal the grey of the ash it walks steps out of your own heat-
      shimmer, close enough to have counted your steps for a while, and
      stops pretending to be shimmer.
warden:
  name: Warden Cinderhide
  prose: >-
    Cinderhide waits at the stair buried to the shoulders in warm ash,
    patient as a stone in a hearth. When it rises, the grey slides off
    a hide of banked coals, and the day gets hotter.
