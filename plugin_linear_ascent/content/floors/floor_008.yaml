floor: 8
tier: 1
biome: Waste
zone: The Ashline
gate_town: Greywell
banner: floor_008
arrival: >-
  Grey ash dunes to the horizon — the burned frontier no crown ever
  wanted. The wind moves the ash in slow sheets, jackals work the
  dune-shadows, and the first hot floor of the climb bakes under
  floodlights that only add glare. Water here is a secret.
encounters:
  - id: cinder_wolf
    name: Ashline jackal
    kind: native
    was: >-
      A dune scavenger that followed the caravans.
    lore: >-
      Pack-bold and fever-lean, coursing warmth across the flats.
    weight: 3
    traits: [lean, fast, fierce]
    prose: >-
      Lean shapes rise out of the dune-shadows one by one, ash sliding
      from their backs — jackals coursing your warmth, pack-bold and
      patient no longer.
  - id: dune_hare
    name: Glass-hare
    kind: native
    was: >-
      A pale desert hare of the strike-fields.
    lore: >-
      Razor-swift over the fulgurite, kicking up glass-dust.
    weight: 3
    traits: [frail, feeble, fast]
    prose: >-
      A pale blur crosses the flat in a spray of glass-dust, doubles,
      and comes through your legs — a hare running strike-glass at a
      speed no fever should allow.
  - id: cinder_salamander
    name: Ash salamander
    kind: native
    was: >-
      A heat-loving rock salamander.
    lore: >-
      Ember-veined, it beds in warm ash and lashes with a scalding
      tail.
    weight: 2
    traits: [resist_low, sturdy]
    prose: >-
      The warm ash you were about to cross opens an orange eye. A
      salamander unbeds itself, ember-veined, tail dragging a line of
      smoke.
  - id: cinder_vulture
    name: Cinder vulture
    kind: native
    was: >-
      A carrion bird of the frontier.
    lore: >-
      Huge and ash-caked, it stoops on anything that slows.
    weight: 2
    traits: [flying, frail]
    prose: >-
      A shadow crosses you twice. The vulture riding it is ash-caked
      and huge, and it has decided you are slowing.
  - id: ash_adder
    name: Dune adder
    kind: native
    was: >-
      A sand-swimming viper of the dunes.
    lore: >-
      Fever-fast, it strikes from under the ash at a footfall.
    weight: 2
    traits: [lean, fierce]
    prose: >-
      The dune's surface pours toward your boot — an adder swimming the
      ash just under the crust, striking at the footfall before the
      foot has landed.
  - id: greywell_ogre
    name: Dune ogre
    kind: pressed
    lore: >-
      Waste-born and collared, set to hold the one deep spring against
      the nomads it once shared water with.
    weight: 1
    traits: [hulking, savage, slow]
    prose: >-
      An ogre stands up from the spring-mouth with an ash-glass boulder
      on its shoulder, sun-mad, collared. It was born to these dunes.
      The collar holds it to the cruelest posting on them.
warden:
  name: Warden Cinderhide
  prose: >-
    The ash-bowl before the lift stirs and Cinderhide stands out of it
    — a dune ogre welded into slag-plate and ash-glass, collar fused to
    its skull, a molten boulder already in hand. The tower made this
    one un-savable.
npc:
  name: Kesh of the Grey Wells
  role: water-finder
  greet: >-
    A wiry figure crouches at a reed-line with a divining-reed in one
    hand and a knife in the other, and watches you a long moment.
    "Kesh. I find water and I keep it found. No crown ever wanted this
    ground — that's why it's still ours."
  lore: >-
    "Follow the greywell reeds and you follow the buried water; the
    deeper in, the richer it runs — which is why the ogres dug in at
    the middle. Share water by the law here, or expect none."
  warn: >-
    "Cinderhide dens in the ash-bowl at the cinder-cone — slag-plated,
    collar fused to the skull. There's no freeing that one; the tower
    saw to it. Strike from the dune-crests, and mourn it after."
