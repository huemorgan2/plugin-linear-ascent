floor: 8
tier: 1
biome: Greenreach
zone: The Burnt Common
gate_town: Ashfold
banner: greenreach
arrival: >-
  The common burned when the land was taken, and the grass never came
  back right — silver-grey, brittle, whispering. Goblin scavenger crews
  rake the ash for anything the fire left. Their rakes have stopped.
encounters:
  - id: ash_goblin
    name: Ash-crew goblin
    lore: >-
      It rakes the burn-lines for anything metal. The rake is taller
      than it is and sharpened on both edges.
    weight: 3
    traits: [frail, feeble]
    prose: >-
      A goblin in a mask of soot and bottle glass straightens from its
      rake. It taps the rake twice on the ground — a signal, or a threat.
  - id: cinder_wolf
    name: Cinder wolf
    lore: >-
      Its coat is singed to wire. It drives prey toward the hot
      ground and waits at the cool edge.
    weight: 3
    traits: [lean, fast, fierce]
    prose: >-
      A wolf the color of the burnt field rises from where it was
      invisible, ash sliding from its back like grey snow.
  - id: charred_boar
    name: Char-tusk boar
    lore: >-
      It survived the burn that took the floor. What's left doesn't
      feel much, and remembers the fire's side.
    weight: 2
    traits: [hulking, savage]
    prose: >-
      A boar blackened from rooting in the burn charges through its own
      dust cloud, tusks scorched to points.
  - id: ember_shade
    name: Ember shade
    lore: >-
      Heat-ghost off the cinder beds. Spellwork feeds it a little
      before it bites.
    weight: 2
    traits: [resist_low, lean, fierce]
    prose: >-
      The grey grass exhales, and the exhale has eyes — a shade of old
      fire that never finished going out. Spells reach it dimmed, the
      way a shout reaches the bottom of a well.
warden:
  name: Warden Greycinder
  prose: >-
    Greycinder stands in the field's dead center, a stag-tall frame of
    charcoal and grate-iron, embers still alive somewhere in its chest.
