floor: 33
tier: 4
biome: Webdeep
zone: The Broodwarrens
gate_town: Silkstead
banner: webdeep
arrival: >-
  Warrens dug tight as honeycomb, every wall padded white with brood
  silk. The air is warm here, the only warm air in the Webdeep, and it
  smells of milk and vinegar. Things hatch in the walls as you pass.
  Try not to take it personally.
encounters:
  - id: brood_swarm
    name: Broodling swarm
    lore: >-
      Forty small spiders with one opinion. They have never once been
      individually.
    weight: 3
    traits: [fast, lean, feeble]
    prose: >-
      A patch of wall-silk sloughs off and becomes forty small spiders
      with one opinion. Individually they are nothing. They have never
      once been individually.
  - id: warren_troll
    name: Warren troll
    lore: >-
      Silk-blinded and kept as a nursery guard, fed just enough. It fills
      the tunnel wall to wall — you will not go around it, only through.
    weight: 3
    traits: [bulwark, slow, feeble]
    prose: >-
      A deep troll has been silk-blinded and kept as a nursery guard,
      fed just enough. It fills the tunnel wall to wall, and it hears
      your heartbeat change.
  - id: midwife_spider
    name: Brood-midwife
    lore: >-
      It turns each egg-sac with terrible gentleness, and it put itself
      between you and the clutch before you decided anything.
    weight: 2
    traits: [lean, savage]
    prose: >-
      A long-legged spider tends a row of egg-sacs, turning each with
      terrible gentleness. It puts itself between you and the clutch
      before you have decided anything.
  - id: warren_bat
    name: Warren bat
    lore: >-
      It nests in the one warm cavern of the Webdeep and pays rent in
      whatever it knocks from the air.
    weight: 2
    traits: [flying, hulking, fierce]
    prose: >-
      Something leathery cuts through the milk-warm air of the warrens,
      shoulder-high and fast, riding the heat off the brood walls straight
      at your lamp.
warden:
  name: Warden Cradlesilk
  prose: >-
    The deepest warren belongs to Cradlesilk, swollen pale and near
    blind, the mother of every small horror you have met today. She
    does not leave the clutch. You will have to come to her.
