floor: 7
tier: 1
biome: Men
zone: The Orchard Rows
gate_town: Cider Cross
banner: floor_007
arrival: >-
  Mile on mile of planted rows gone to rot, the ground ankle-deep in
  windfall fermenting under the floodlights. The air is thick, sweet,
  and drunk; wasps hang in it like sparks. Nine generations pruned
  these trees. Nobody will pick them.
encounters:
  - id: orchard_wolfpack
    name: Orchard wolf
    kind: native
    was: >-
      a wolf that denned in the windbreak rows
    lore: >-
      It hunts the rows in silent packs, drunk-bold on the haze.
    weight: 3
    traits: [lean]
    prose: >-
      Grey shapes flow between the trunks on both sides, keeping your
      pace — an orchard pack, drunk-bold on the haze, herding you
      toward the deeper rows.
  - id: rabid_boar
    name: Cider-mad boar
    kind: native
    was: >-
      a windfall-fed boar of the rows
    lore: >-
      Reeling, furious, and fearless on fermented mush.
    weight: 2
    traits: [hulking, savage, armoured]
    prose: >-
      A boar the size of a hay-wain reels out of the windfall, soaked
      in rot-cider, furious at nothing and now at you. It does not feel
      the branches it breaks.
  - id: hornet_swarm
    name: Mouse-tide
    kind: native
    was: >-
      a single field mouse from under the press-house floor
    lore: >-
      The wrongness would not let one small thing stay one. It follows
      warmth and sweat as a hundred now.
    weight: 2
    traits: [frail, fierce, fly]
    prose: >-
      The rustle you took for the presses sharpens and turns toward
      you — a boiling carpet of mice the size of a cart, moving as one
      mind, reading your sweat on the sweet air.
  - id: windfall_crow
    name: Windfall dormouse
    kind: native
    was: >-
      a fat dormouse that slept in the high forks
    lore: >-
      Bloated on rot, reeling in drunk spirals, going for the eyes.
    weight: 2
    traits: [frail, feeble, fly]
    prose: >-
      Something heavy drops out of the high forks and comes reeling
      across the windfall — a dormouse bloated on rot, going for the
      eyes.
  - id: orchard_hare
    name: Orchard hare
    kind: native
    was: >-
      a bark-nibbling hare of the rows
    lore: >-
      Fever-swift, bolting between the rows into shins and ankles.
    weight: 2
    traits: [frail, feeble]
    prose: >-
      Something small tears down the row at shin height, fever-swift,
      and does not swerve. It has stopped swerving for anything.
  - id: windfall_wight
    name: Windfall haunt
    kind: wrongmade
    lore: >-
      A presser drowned in a vat, aether soaked into the black cider.
      It offers a cup.
    weight: 1
    traits: [sturdy, magic_resist]
    prose: >-
      A reeling, dripping figure waits between the rows, black cider
      running from it like sweat. One hand offers a cup. Watch the
      other hand.
warden:
  name: Warden Applewrath
  prose: >-
    The deep windfall heaves and Applewrath comes up out of it charging
    — a cider-mad boar under press-iron and barrel-hoops, black cider
    dripping from the seams, the haze thick around it.
npc:
  name: Cesta Pommet
  role: master-presser
  greet: >-
    A woman meets you at the shuttered nursery door, graft-knife in her
    belt. "Cesta Pommet, master-presser. Nine generations planted these
    rows; the tenth is picking the fruit for the wasps. State your
    business quick — the haze drifts."
  lore: >-
    "The rot-haze makes a body forget to run — chew willow-bark and
    keep moving. The rows run inward and down, and the last miles are
    the darkest and the drunkest. Never follow fruit that looks whole."
  warn: >-
    "Applewrath beds in the deep windfall behind the press-house. It
    charges in a spray of rotten fruit and the haze comes with it. Hold
    the upwind row or you'll fight it drunk."
