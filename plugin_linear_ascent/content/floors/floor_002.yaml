floor: 2
tier: 1
biome: Giants
zone: The Rustwater Adit
gate_town: Lampfall
banner: floor_002
arrival: >-
  A slab of mountainside ends at a mine-mouth still weeping orange
  iron-water. Ore-carts sit loaded on rails that run off the cut edge
  into open air. Somewhere down the dark drift, water is moving.
encounters:
  - id: marsh_wolf
    name: Rust hound
    kind: native
    was: >-
      a pit-dog that hauled carts and slept warm by the forge
    lore: >-
      Iron-scale coats it and its jaws lock half-open. The packs still
      run the rails, hauling nothing.
    weight: 3
    traits: [lean, fast]
    prose: >-
      A hound coated in rust-scale comes down the rails at a working
      trot, jaws locked half-open. It has run this line all its life.
      Now it runs it at you.
  - id: cave_cricket
    name: Cave cricket
    kind: native
    was: >-
      a harmless roof-cricket of the entrance hall
    lore: >-
      Fist-sized now, it springs man-high and strips leather and
      lamp-wick down to nothing.
    weight: 3
    traits: [frail, feeble]
    prose: >-
      The roof rustles and a fist-sized cricket lands on your pack,
      then another — springing shapes that strip leather, wick, anything
      that once was soft.
  - id: shellback_tortoise
    name: Shellback tortoise
    kind: native
    was: >-
      a sump-pool tortoise the pit crews kept for luck
    lore: >-
      Grown door-broad in the flooded drift, shell crusted to
      rust-plate. It holds the narrow ways like a gate.
    weight: 2
    traits: [armor_low, hulking, slow]
    prose: >-
      Something the width of a cart door drags itself out of the orange
      water — a tortoise in a shell of rust-crusted plate, older than
      the flood and slower than patience.
  - id: kobold_digger
    name: Kobold digger
    kind: pressed
    lore: >-
      First-taken from the warrens far below and set to cut the giants'
      seams. The collar does the deciding.
    weight: 2
    traits: [lean, feeble]
    prose: >-
      A kobold in a collar swings its mattock at your lamp, half-blind
      from years in the dark. It was never asked whether it wanted to
      dig.
  - id: orc_overseer
    name: Red Orc outrider
    kind: pressed
    lore: >-
      A pressed veteran of Skarn's warcamp, sent down to keep the
      diggers digging. No one pays the wage it kills for.
    weight: 1
    traits: [sturdy, savage]
    prose: >-
      A scarred Red Orc steps from the drift with a drover's whip and
      an underfed look. It hates this posting, this mine, and whatever
      interrupts the count. Today that is you.
  - id: rust_seep
    name: The Seep
    kind: wrongmade
    lore: >-
      Spilled aether pooled in the rust-water. It was never alive; it
      only moves.
    weight: 1
    traits: [sturdy, slow]
    prose: >-
      An orange stain crawls up the drift wall against the run of the
      water, spreading fingers. Where it has passed, the rock is eaten
      smooth.
warden:
  name: Warden Rustmaw
  prose: >-
    The flooded main drift goes quiet. Then the water heaves and Rustmaw
    stands up in it — a pit hound welded into a war-engine, an
    ore-crusher's jaw grafted over its head, dragging the rails behind.
npc:
  name: Bergda Ironkettle
  role: pit-foreman
  greet: >-
    A giant woman fills the lamp-room door, a dead safety-lamp in one
    fist. "Bergda Ironkettle, foreman of this pit. The mountain still
    weeps where they cut it. We drink what it weeps. Mind your lamp."
  lore: >-
    "Every seam runs inward and down, and the water owns the low
    galleries. Taste the water before you trust a drift — sweet means
    sound rock, sour means the Seep has walked there."
  warn: >-
    "Rustmaw hunts the flooded main drift, where the water hides its
    footing. It bites like a stamp-mill. If you hear rails dragging,
    climb — it cannot take a bench at speed."
