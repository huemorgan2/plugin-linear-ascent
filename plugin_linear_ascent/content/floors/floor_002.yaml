floor: 2
tier: 1
biome: Greenreach
zone: The Drowned Pasture
gate_town: Weirsend
banner: greenreach
arrival: >-
  The meadow dips into flooded pasture, the old drainage cut when the land
  was torn skyward. Floodlight beams lie across the water in long white
  bars. Things wade out there, unhurried.
encounters:
  - id: marsh_wolf
    name: Marsh wolf
    lore: >-
      It hunts where the ground lies. Half its kills never fought
      back — they just sank.
    weight: 3
    prose: >-
      A wolf lopes through the shallows without a sound, coat slicked
      dark, eyes catching the floodlight like two coins.
  - id: mire_boar
    name: Mire boar
    lore: >-
      Wallow mud dries on it in plates. Most of the year that's
      vanity; in a fight it's luck.
    weight: 2
    prose: >-
      A mud-caked boar heaves itself off a drowned hay rick, shaking
      water in sheets, and squares up in the reeds.
  - id: goblin_wader
    name: Goblin wader
    lore: >-
      Stilt-legged and patient, it spears eels all day. You are
      slower than an eel.
    weight: 3
    prose: >-
      Two lamps on a pole — no, a goblin on stilts, scrap-rifle slung
      high, picking through the flood for anything worth stealing.
  - id: shellback_tortoise
    name: Shellback tortoise
    lore: >-
      Old enough to remember the marsh as farmland. Its shell has
      turned harder arguments than yours.
    weight: 2
    traits: [armor_low]
    prose: >-
      The hay rick you took for an island stands up. A tortoise broad
      as a cart bed, shell scarred white where blades have tried it
      before, wades toward you with terrible patience.
warden:
  name: Warden Sedgeback
  prose: >-
    The keep is a drowned barn, and Sedgeback rises out of it — a boar
    grown wrong, plated in rusted field-tin, water pouring off its back.
