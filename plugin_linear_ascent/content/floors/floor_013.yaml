floor: 13
tier: 2
biome: Ironvale
zone: The Counting Halls
gate_town: Ledgerstone
banner: ironvale
arrival: >-
  Every ounce that left the mines was weighed here, in halls of brass and
  slate. The tally-engines still run on habit, counting shipments that
  stopped coming years ago. Kobolds have learned to read just enough to
  argue with them.
encounters:
  - id: coin_sifter
    name: Kobold coin-sifter
    lore: >-
      It cannot read the scrip it hoards, but it knows exactly what a hand
      reaching for the pile means.
    weight: 3
    traits: [lean, feeble]
    prose: >-
      A kobold sits in a drift of worthless scrip, sorting it by color.
      It takes your arrival as a bid on its hoard and reaches for the
      weighing-hammer.
  - id: tally_engine
    name: Haywire tally-engine
    lore: >-
      Brass casing, broken arithmetic. It has been counting to the same
      wrong number for years.
    weight: 3
    traits: [lean, fierce, armoured]
    prose: >-
      A brass engine unbolts itself from the counting bench, arms still
      flicking beads on a broken frame. It has found an error in the
      ledger, and the error is you.
  - id: debt_collector
    name: Red Orc debt-collector
    lore: >-
      The warband taxes everything that walks this floor. The plate is
      company property; the enthusiasm is its own.
    weight: 2
    traits: [fierce, armoured]
    prose: >-
      An orc in a warframe painted with tally-marks blocks the aisle.
      The warband taxes this floor, it explains, and you have walked in
      carrying assets.
  - id: ledger_wisp
    name: Ledger wisp
    lore: >-
      The Counting Halls remember every unpaid ounce. Some of that memory
      has come loose and drifts.
    weight: 2
    traits: [sturdy, fierce, fly]
    prose: >-
      A pale figure of dust and lamplight rises off the grand ledger — a
      wisp in the shape of a column of figures, drifting toward you to be
      balanced.
  - id: scrip_rat
    name: Scrip rat
    lore: >-
      It nests in worthless money and defends it like treasure, which on
      this floor passes for wisdom.
    weight: 2
    traits: [sturdy, savage]
    prose: >-
      A rat surfaces from a drift of colored scrip, cheeks packed with
      paper, and decides the shortest way to its next nest runs straight
      through you.
warden:
  name: Warden Brassbone
  prose: >-
    Brassbone hangs above the grand scales, a skeleton of counting-rods
    and weight-plates. It drops onto the pans, balances perfectly, and
    waits to weigh you out.
