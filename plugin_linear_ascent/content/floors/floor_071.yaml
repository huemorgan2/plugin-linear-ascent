floor: 71
tier: 8
biome: The Gloom
zone: The Eaves
gate_town: Lastlamp
banner: gloom
arrival: >-
  Above the storm the tower goes quiet. A forest floor with no sky —
  black boughs closing overhead, and under them a dusk that never
  ripens into night. The gate town keeps one lamp lit facing the
  trees, and the trees keep their distance. Mostly.
encounters:
  - id: eaves_shade
    name: Eaves shade
    lore: >-
      It is thrown ahead of you by no light at all, and when you stop, it
      keeps walking. Spells pass through what isn't there.
    weight: 3
    traits: [resist_med]
    prose: >-
      Your shadow arrives before you do — thrown ahead on the path by
      no light at all. It waits for you to catch up, and when you
      stop, it keeps walking.
  - id: gloom_hound
    name: Gloom hound
    lore: >-
      The Huntsman's stock run loose between hunts, keeping themselves
      fed. The downwind circle is habit it does not need.
    weight: 3
    traits: [fast]
    prose: >-
      A hound the color of the space between trees crosses the path,
      soundless. The Huntsman's stock run loose out here between
      hunts, keeping themselves fed. It circles downwind, from habit
      it does not need.
  - id: dead_signal
    name: Dead signal
    lore: >-
      The old realm's transmissions never died here. They just kept
      walking, and one of them knows your name.
    weight: 2
    traits: [resist_low]
    prose: >-
      A voice you almost know calls your name from off the path — the
      exact tone of someone in Roothollow, worn thin by distance. The
      old realm's transmissions never died here. They just kept
      walking.
  - id: dusk_boar
    name: Dusk boar
    lore: >-
      It roots the treeline where the lamplight fails, and it has decided
      the failing light is its property.
    weight: 2
    prose: >-
      A boar built low and wide comes out from under the black boughs,
      tusks catching the last of the town's lamp, and takes one deliberate
      step onto the path you wanted.
warden:
  name: Warden Duskhide
  prose: >-
    Duskhide holds the treeline where the last lamplight fails — a
    stag-shadow with no stag in it, antlers of pure absence. Arrows
    go through. The dark between the trees does not.
