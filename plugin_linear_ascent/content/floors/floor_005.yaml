floor: 5
tier: 1
biome: Giants
zone: The Flooded Mine
gate_town: Pumpstead
banner: floor_005
arrival: >-
  Gallery after gallery runs down into dead-black water. The great
  pumps that held it back are drowned with the deep they kept dry, and
  drowned gear hangs on drowned pegs. The flat water goes down further
  than any lamp will show.
encounters:
  - id: blind_shoal
    name: Blind cave-fish
    kind: native
    was: >-
      Pallid schooling fish of the drowned galleries.
    lore: >-
      Massed and biting, they boil the surface wherever warmth touches
      it.
    weight: 3
    traits: [frail, feeble]
    prose: >-
      The water around your boots begins to boil — a shoal of pallid,
      eyeless fish, massed and biting at the first warmth this gallery
      has known in years.
  - id: drift_eel
    name: Sump eel
    kind: native
    was: >-
      A blind drift-eel of the deep water.
    lore: >-
      Fever-long, it strikes up from the flat black at a lamp's
      reflection.
    weight: 2
    traits: [lean, fierce]
    prose: >-
      The dead-flat water breaks without warning — a blind eel long as
      a hoist-rope, striking up at your lamp's reflection with your
      face behind it.
  - id: downs_courser
    name: Drift courser
    kind: native
    was: >-
      A winder's hound that ran messages between the galleries.
    lore: >-
      It still runs the dry drifts end to end, fever-fast, coursing
      anything that carries a light.
    weight: 2
    traits: [fast, lean, fierce]
    prose: >-
      Claws hammer the dry gallery behind you, gaining — a mine-hound
      running its old message-route at fever pace, and you are standing
      on the route.
  - id: coolant_crab
    name: Sump-crawler
    kind: native
    was: >-
      A cave-crab of the flooded drifts.
    lore: >-
      Shield-backed and many-legged, it scuttles the drowned floors
      underfoot.
    weight: 2
    traits: [armor_low, sturdy, slow]
    prose: >-
      The floor of the flooded drift moves under your boot — a
      shield-backed crawler the size of a cart-wheel, sidling up out of
      the black with its arms open.
  - id: bailer_kobold
    name: Bilge kobold
    kind: pressed
    lore: >-
      First-taken from the warrens and set to bail the deep by hand.
      The collar keeps it at it.
    weight: 2
    traits: [lean, feeble]
    prose: >-
      A kobold stands waist-deep in the black water with a bailing-hook,
      wet to the bone, collared. It swings at your lamp because the
      lamp found it.
  - id: miner_husk
    name: Drowned-miner husk
    kind: wrongmade
    lore: >-
      A drift-crew's lost lamp and gear, aether pooled in the flood
      over them. It wades in the shape of a working man.
    weight: 1
    traits: [resist_low, sturdy, slow]
    prose: >-
      A lamp comes wading up the flooded gallery at shift-pace, hung on
      a shape like a working man. The shape is water and old gear. The
      lamp is real.
warden:
  name: Warden Sumplock
  prose: >-
    The flood stands dead-flat, then jets — Sumplock, a giant sump-eel
    welded through with a pump-valve maw, takes the gallery's water in
    and fires it back hard enough to sweep your feet, striking from the
    wave.
npc:
  name: Durn Sumphand
  role: master of pumps
  greet: >-
    A giant stands watch on the drowned engine-house, arms folded over
    the frozen beam. "Durn Sumphand, master of pumps. We built them to
    keep the deep dry. Now the pumps are drowned too. Say your piece —
    I'm listening for the beam."
  lore: >-
    "Dry mouths at the rim, flood at the middle — every drift dives
    inward, so count your steps back. The sump-weed closes on whatever
    stirs the surface, and the glow that draws you to it is fungus, not
    a lamp."
  warn: >-
    "Sumplock rules the drowned galleries, and its own element hides
    it. It sweeps your feet with the wave before it ever strikes. Fight
    it from the high dry ledges or feed it."
