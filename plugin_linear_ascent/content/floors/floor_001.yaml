floor: 1
tier: 1
biome: Men
zone: The Fencerows
gate_town: Lamplit Steading
banner: greenreach
arrival: >-
  Stolen meadowland rolls out under the tower's floodlights. Hedgerows
  still stand in their old lines, fencing fields no farmer will cut again.
  Somewhere out in the grass, something is moving.
encounters:
  - id: grey_wolf
    name: Grey wolf
    kind: native
    was: >-
      the shy grey wolf the farm dogs kept past the fences
    lore: >-
      Farm dogs once kept them past the fences. The dogs are gone; the
      wolves remember the gap in the third hedge.
    weight: 3
    prose: >-
      A grey wolf slides out of the hedgerow, ribs showing under a dull
      coat. It has learned that climbers carry meat.
  - id: feral_boar
    name: Feral boar
    kind: native
    was: >-
      an ordinary sty boar, escaped, under the fever
    lore: >-
      Sty stock gone wild in two generations. It charges first and
      decides why later.
    weight: 3
    traits: [sturdy, fierce]
    prose: >-
      A boar the size of a cart tears up the turf between you and the
      path, tusks yellowed and one ear ragged from old fights.
  - id: hedge_rat
    name: Hedgerow rat
    kind: native
    was: >-
      a granary rat that ate its fill in the dark and kept growing
    lore: >-
      Granary doors stood open the night the farms fell. What ate its
      fill in the dark kept growing.
    weight: 2
    traits: [frail, feeble]
    prose: >-
      Something the size of a dog bursts from the fencerow in a spray
      of leaves — a rat grown fat on abandoned granaries, teeth first.
  - id: lane_wolf
    name: The last pack
    kind: native
    was: >-
      one of the steading's own sheepdogs — the very dogs that once
      kept the wolves out
    lore: >-
      The steading's sheepdogs, feral now, hunting in a silent ring.
      One of them still turns its head at a whistle.
    weight: 2
    traits: [lean, savage]
    prose: >-
      Shapes fold out of the hedges on every side — the steading's own
      sheepdogs, feral and silent, working you the way they once worked
      sheep.
  - id: goblin_straggler
    name: Goblin straggler
    kind: pressed
    lore: >-
      Marched down from the warrens to hold the low gate, then left
      behind sick when the war-band climbed on. Nobody pays its wage.
    weight: 2
    traits: [lean, feeble]
    prose: >-
      A lone goblin in a stitched rag-coat drags a notched longsword
      through the grass, too heavy for it by half. It sees you, sets
      its feet behind the sword anyway, and grins.
  - id: ember_shade
    name: Hedge-wight
    kind: wrongmade
    lore: >-
      Spilled aether soaked into a rotten stile. Nothing living was
      ever in it.
    weight: 1
    traits: [hulking]
    prose: >-
      At the floodlights' flicker a man-shape stands up out of the
      hedge — blackthorn snarled into shoulders and arms, walking the
      fence line it grew from.
warden:
  name: Warden Brackjaw
  prose: >-
    The stair-lift hums behind a beast of wolf and welded plate. Brackjaw
    circles once, servos ticking, and lowers its head to charge.
npc:
  name: Hobb Fennick
  role: the last farmer
  greet: >-
    An old man mends a fence that pens nothing. "Hobb Fennick. I farmed
    this land when it was land. Now I count what comes out of the hedges,
    and I count the climbers who go in. The counts don't match."
  lore: >-
    "The hedgerows were mine once. Wolves come through the gap in the
    third hedge — the dogs that kept it are gone. Mind the grass when it
    stops moving. That's when something has set its feet."
  warn: >-
    "Brackjaw hunts the stair-lift meadow — wolf where it counts, welded
    plate where it doesn't. It circles once before it charges. Once."
