floor: 4
tier: 1
biome: Greenreach
zone: The Beacon Field
gate_town: Pylon Rest
banner: greenreach
arrival: >-
  A floodlight pylon has toppled here, and its beam still burns along the
  ground, a river of white across black grass. Goblins have built a camp
  in the light. They think nothing hunts what stands in it. Wrong.
encounters:
  - id: beacon_goblin
    name: Beacon-camp goblin
    lore: >-
      It tends the signal fires that called the horde down. It will
      die keeping one lit.
    weight: 3
    traits: [sturdy, fierce]
    prose: >-
      A goblin sentry steps into the beam's edge, scrap-rifle raised,
      squinting past the glare at your silhouette.
  - id: shadow_wolf
    name: Shadow-line wolf
    lore: >-
      It has learned the lamplight's edges and hunts one step
      outside them.
    weight: 3
    traits: [lean, savage]
    prose: >-
      Along the dark edge of the beam a wolf keeps pace with you,
      appearing and vanishing at the light's border like a blade drawn
      and sheathed.
  - id: goblin_lampwright
    name: Goblin lampwright
    lore: >-
      Half artisan, half arsonist. The lamps it hangs burn green and
      mark the paths its kin avoid.
    weight: 2
    traits: [frail, feeble]
    prose: >-
      A goblin in a harness of stolen lenses is prying glass from the
      fallen pylon. It draws a shard like a knife, unwilling to share.
  - id: glare_moth
    name: Glare moth
    lore: >-
      It rides the beacon updrafts above spear-height. Nothing on the
      ground has touched it in years.
    weight: 2
    traits: [flying, frail]
    prose: >-
      Out of the beam drops a moth with a wingspan like a barn door,
      scales throwing the floodlight back in knives. It circles above
      sword-reach, waiting for you to look up into the glare.
warden:
  name: Warden Glarefang
  prose: >-
    At the pylon's broken head crouches Glarefang, a wolf remade in
    chrome, one eye a burning floodlamp. Its shadow is thrown a mile long.
npc:
  name: Sella
  role: beam-watcher
  greet: >-
    A climber gone grey sits with her back to the fallen pylon, eyes on
    the beam. "Sella. I watch the light. Stand in it and everything
    sees you. Stand out of it and you see everything. Choose."
  lore: >-
    "The goblins camp in the beam because they think light is armor.
    The wolves hunt the shadow-line where it breaks. And don't look at
    the moths when they open their wings — that's how they eat."
  warn: >-
    "Glarefang lairs where the beam dies at the lift-house. Its eyes
    throw the light back at you, and it strikes while you're blinking."
